<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planner Mensal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-top">
        <button class="menu-button" type="button" aria-label="Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>

      <div class="today-panel">
        <span class="today-label">Hoje</span>
        <strong id="todayNumber">--</strong>
        <span id="todayWeekday">--</span>
      </div>

      <section class="events-summary">
        <h2>Eventos do mês</h2>
        <ul id="monthEventsList">
          <li class="empty-summary">Nenhum evento cadastrado</li>
        </ul>
      </section>

      <button class="add-event-sidebar" id="openCreateButton" type="button">
        <span>Adicionar evento</span>
        <strong>+</strong>
      </button>
    </aside>

    <section class="calendar-area">
      <header class="calendar-header">
        <div class="year-navigation">
          <button id="previousYear" type="button" aria-label="Ano anterior">‹</button>
          <span id="currentYear">2026</span>
          <button id="nextYear" type="button" aria-label="Próximo ano">›</button>
        </div>

        <div class="month-navigation">
          <button id="previousMonth" type="button" aria-label="Mês anterior">‹</button>
          <h1 id="currentMonth">Janeiro</h1>
          <button id="nextMonth" type="button" aria-label="Próximo mês">›</button>
        </div>

        <button class="today-button" id="goToToday" type="button">
          Hoje
        </button>
      </header>

      <div class="calendar-wrapper">
        <div class="weekdays" aria-hidden="true">
          <div>Domingo</div>
          <div>Segunda-feira</div>
          <div>Terça-feira</div>
          <div>Quarta-feira</div>
          <div>Quinta-feira</div>
          <div>Sexta-feira</div>
          <div>Sábado</div>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
    </section>
  </main>

  <div class="modal hidden" id="eventModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">Adicionar evento</h2>
        <button class="close-modal" id="closeModal" type="button" aria-label="Fechar">×</button>
      </div>

      <form id="eventForm">
        <input type="hidden" id="eventId">

        <label for="eventTitle">Nome ou título</label>
        <input
          id="eventTitle"
          type="text"
          placeholder="Ex.: Estudar Engenharia de Software"
          required
        >

        <div class="form-row">
          <div>
            <label for="eventStart">Data inicial</label>
            <input id="eventStart" type="date" required>
          </div>

          <div>
            <label for="eventEnd">Data final</label>
            <input id="eventEnd" type="date" required>
          </div>
        </div>

        <div class="form-row">
          <div>
            <label for="eventIcon">Ícone</label>
            <select id="eventIcon">
              <option value="📚">📚 Livro</option>
              <option value="🎯">🎯 Objetivo</option>
              <option value="💼">💼 Trabalho</option>
              <option value="🎓">🎓 Estudos</option>
              <option value="🏋️">🏋️ Exercício</option>
              <option value="✈️">✈️ Viagem</option>
              <option value="🎉">🎉 Evento</option>
              <option value="📝">📝 Tarefa</option>
              <option value="❤️">❤️ Pessoal</option>
            </select>
          </div>

          <div>
            <label for="eventColor">Cor</label>
            <input id="eventColor" type="color" value="#8b5cf6">
          </div>
        </div>

        <p class="form-error" id="formError"></p>

        <div class="modal-actions">
          <button class="delete-button hidden" id="deleteEventButton" type="button">
            Excluir
          </button>

          <div class="modal-actions-right">
            <button class="cancel-button" id="cancelModal" type="button">
              Cancelar
            </button>
            <button class="save-button" type="submit">
              Salvar evento
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
